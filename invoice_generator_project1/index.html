<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoice Generator</title>
  <!-- Linking external CSS file -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="invoice-card">
    <div class="header">
      <div>
        <h2>INVOICE</h2>
        <p>Tech Services & Solutions</p>
      </div>
      <div class="text-right">
        <p><strong>Invoice #:</strong> INV-2026-001</p>
        <p><strong>Date:</strong> <span id="currentDate"></span></p>
      </div>
    </div>

    <div class="details">
      <div>
        <strong>Billed To:</strong><br>
        Karthik Enterprises<br>
        karthik@example.com
      </div>
      <div class="text-right">
        <strong>Payment Status:</strong><br>
        <span class="status-paid">PAID</span>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Description</th>
          <th class="text-right">Qty</th>
          <th class="text-right">Price (₹)</th>
          <th class="text-right">Amount (₹)</th>
        </tr>
      </thead>
      <tbody id="invoiceItems">
        <!-- Rendered by JavaScript -->
      </tbody>
    </table>

    <div class="total-section">
      <div class="total-box">
        <div class="total-row">
          <span>Subtotal:</span>
          <span id="subTotal">₹0.00</span>
        </div>
        <div class="total-row">
          <span>Tax (GST 18%):</span>
          <span id="taxTotal">₹0.00</span>
        </div>
        <div class="total-row grand-total">
          <span>Total:</span>
          <span id="grandTotal">₹0.00</span>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="btn-print" onclick="window.print()">Print / Save as PDF</button>
    </div>
  </div>

  <script>
    const items = [
      { desc: "Linux Server Setup & Configuration", qty: 1, price: 5000 },
      { desc: "Docker Container Deployment", qty: 2, price: 3500 },
      { desc: "Nginx Web Proxy Configuration", qty: 1, price: 2000 }
    ];

    const tbody = document.getElementById("invoiceItems");
    let subtotal = 0;

    items.forEach(item => {
      const amount = item.qty * item.price;
      subtotal += amount;

      const row = `
        <tr>
          <td>${item.desc}</td>
          <td class="text-right">${item.qty}</td>
          <td class="text-right">₹${item.price.toFixed(2)}</td>
          <td class="text-right">₹${amount.toFixed(2)}</td>
        </tr>
      `;
      tbody.innerHTML += row;
    });

    const tax = subtotal * 0.18;
    const total = subtotal + tax;

    document.getElementById("subTotal").innerText = `₹${subtotal.toFixed(2)}`;
    document.getElementById("taxTotal").innerText = `₹${tax.toFixed(2)}`;
    document.getElementById("grandTotal").innerText = `₹${total.toFixed(2)}`;

    const today = new Date().toLocaleDateString('en-GB');
    document.getElementById("currentDate").innerText = today;
  </script>

</body>
</html>
